version: '3.8'

services:
  api-server:
    build: .
    ports:
      - "5001:5000" # Maps your backend API port
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/database.sqlite
    volumes:
      - sqlite_data:/app/data # Persistent storage for SQLite file
    restart: always

volumes:
  sqlite_data: # Declares the persistent volume
